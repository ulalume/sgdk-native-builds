name: build

# Build a single SGDK ref into a self-contained, native distribution for each
# platform: native SGDK tools (xgmtool/bintos/convsym/sjasm) + mac68k + libmd.a /
# libmd_debug.a, built against the prebuilt gcc 13 toolchain (NOT rebuilt here).
#
# Building logic mirrors sgdk-setup.sh (build_sgdktools + makelib.gen). The gcc
# toolchain and mac68k are downloaded from their own release repos and composed in.
#
# Used directly (workflow_dispatch, on-demand for any ref) and via workflow_call
# from sync.yml (tags since v2.00 + master).
#
# Release ordering: GitHub sorts the Releases page by each tag's commit date, so the
# `release` job tags an EMPTY commit dated at the SGDK ref's commit time and creates
# the release; build/docs jobs only upload assets to it. This keeps releases sorted
# chronologically and lets GitHub auto-pick the newest as "Latest".

on:
  workflow_dispatch:
    inputs:
      sgdk_ref:    { description: "SGDK git ref (tag / branch / SHA)", required: true, default: "master" }
      release_tag: { description: "Release tag to publish in THIS repo", required: true }
  workflow_call:
    inputs:
      sgdk_ref:    { type: string, required: true }
      release_tag: { type: string, required: true }

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: "noninteractive"   # apt: never block on a debconf prompt (mingw threading default)
  GCC_VERSION: "13.2.0"
  TOOLCHAIN_REPO: "ulalume/m68k-toolchain-builds"
  TOOLCHAIN_TAG: "gcc13.2.0-1"        # m68k-toolchain-builds release providing the gcc 13 toolchain
  MACCER_REPO: "ulalume/maccer"
  MACCER_TAG: "v0.26-1"
  SGDK_REPO: "Stephane-D/SGDK"
  SJASM_VERSION: "v0.39"

jobs:
  release:
    name: create dated release
    runs-on: ubuntu-latest
    outputs:
      # Later jobs address the release by this numeric id instead of by tag: while it is still a
      # draft, the by-tag REST endpoint hides it and `gh release view/upload/edit <tag>` cannot
      # resolve it reliably.
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release tagged at the SGDK commit date
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.sgdk_ref }}"
          TAG="${{ inputs.release_tag }}"
          # resolve the upstream commit this ref points to: its full sha + date + a link
          SGDK_SHA="$(gh api "repos/${SGDK_REPO}/commits/${REF}" --jq '.sha')"
          SGDK_DATE="$(gh api "repos/${SGDK_REPO}/commits/${REF}" --jq '.commit.committer.date')"
          SRC_URL="https://github.com/${SGDK_REPO}/commit/${SGDK_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          empty="$(git hash-object -t tree /dev/null)"
          # empty commit dated at the upstream commit time -> Releases page sorts chronologically
          c="$(GIT_AUTHOR_DATE="$SGDK_DATE" GIT_COMMITTER_DATE="$SGDK_DATE" git commit-tree "$empty" -m "$TAG")"
          git tag -f "$TAG" "$c"
          git push -f origin "refs/tags/$TAG"

          # Title + notes are ALWAYS (re)set so every build/backfill normalizes older releases that
          # were created with a different format. Notes link the exact upstream SGDK commit.
          TITLE="SGDK $TAG"
          NOTES="Native SGDK build — upstream ref \`${REF}\` (${SGDK_DATE}).

          SGDK source commit: ${SRC_URL}"
          # Find this tag's release INCLUDING drafts: /releases/tags/<tag> returns published
          # releases only, so a draft has to be matched in the full (authenticated) listing.
          rid="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                   --jq '.[] | "\(.tag_name)\t\(.id)"' \
                 | awk -F'\t' -v t="$TAG" '$1 == t { print $2; exit }')"

          if [ -n "$rid" ]; then
            # Existing release: refresh title/notes only. draft/make_latest are deliberately NOT
            # touched, so backfilling an already-published release never un-publishes it.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$rid" \
              -f name="$TITLE" -f body="$NOTES" >/dev/null
          else
            # A NEW release starts as a DRAFT; the finalize job publishes it once all five
            # platform bundles are attached. Listing order is unaffected: a release's created_at
            # is the tagged commit's date, not the publish time -- the same property the dated
            # empty commit above relies on to keep the Releases page chronological.
            rid="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                     -f tag_name="$TAG" -f name="$TITLE" -f body="$NOTES" \
                     -F draft=true --jq '.id')"
          fi
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux native tools built INSIDE manylinux2014 (glibc 2.17) so they run on old distros.
          # (libmd.a is m68k target code -> built on the host; only the glibc-linked native tools
          # need the old container.)
          - { name: linux-x86_64,   runner: ubuntu-latest,    os: linux, container: "quay.io/pypa/manylinux2014_x86_64" }
          - { name: linux-arm64,    runner: ubuntu-24.04-arm, os: linux, container: "quay.io/pypa/manylinux2014_aarch64" }
          - { name: macos-arm64,    runner: macos-15,         os: macos }
          - { name: macos-x86_64,   runner: macos-15-intel,   os: macos }
          - { name: windows-x86_64, runner: ubuntu-latest,    os: windows-cross }   # self-contained bundle, cross-built on ubuntu via mingw

    steps:
      - name: Install host build deps
        shell: bash
        run: |
          set -ex
          if [ "${{ matrix.os }}" = windows-cross ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential make unzip \
              gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          elif [ "${{ matrix.os }}" = macos ]; then
            brew install make || true
          fi
          # linux: native tools build inside the manylinux2014 container; libmd builds on the host
          # with the downloaded m68k toolchain (make/curl/tar are preinstalled on the runner).

      - name: Fetch prebuilt gcc toolchain + mac68k
        if: ${{ matrix.os != 'windows-cross' }}
        shell: bash
        run: |
          set -ex
          P="${{ matrix.name }}"
          curl -fSL -o toolchain.tar.gz \
            "https://github.com/${TOOLCHAIN_REPO}/releases/download/${TOOLCHAIN_TAG}/m68k-elf-toolchain-gcc${GCC_VERSION}-${P}.tar.gz"
          tar xf toolchain.tar.gz          # -> m68k-elf-toolchain/
          curl -fSL -o maccer.tar.gz \
            "https://github.com/${MACCER_REPO}/releases/download/${MACCER_TAG}/mac68k-${P}.tar.gz"
          tar xf maccer.tar.gz             # -> mac68k-<platform>/mac68k
          "$PWD/m68k-elf-toolchain/bin/m68k-elf-gcc" --version

      - name: Checkout SGDK at ref
        shell: bash
        run: |
          set -ex
          git clone "https://github.com/${SGDK_REPO}.git" SGDK
          cd SGDK
          git checkout "${{ inputs.sgdk_ref }}"
          git rev-parse HEAD

      - name: Patch makefile.gen — keep debug-build DWARF valid
        shell: bash
        run: |
          set -ex
          # `make debug` links with -Wl,--gc-sections, which drops unused function
          # code but leaves its DWARF at low_pc=0. Those orphaned entries overlap the
          # user's code addresses, so gdb/cppdbg mis-resolve a PC in your code to SGDK
          # internals (e.g. bmp.c/doBlit) and source-level debugging is unusable.
          # Skip --gc-sections for DEBUG builds only (release still gets it, for size),
          # via an inline make conditional so the single link rule serves both.
          mk=SGDK/makefile.gen
          if grep -qF 'filter debug,$(BUILD_TYPE)' "$mk"; then echo "already patched"; exit 0; fi
          grep -qF -- '-Wl,--gc-sections' "$mk" || { echo "::error::-Wl,--gc-sections not found in $mk (upstream layout changed)"; exit 1; }
          sed 's|-Wl,--gc-sections|$(if $(filter debug,$(BUILD_TYPE)),,-Wl,--gc-sections)|' "$mk" > "$mk.tmp"
          mv "$mk.tmp" "$mk"
          grep -qF 'filter debug,$(BUILD_TYPE)' "$mk" || { echo "::error::makefile.gen patch did not apply"; exit 1; }
          grep -n 'gc-sections' "$mk"

      - name: Build native SGDK tools (macOS native) + mac68k
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: |
          set -ex
          ROOT="$PWD"
          GDK="$ROOT/SGDK"
          JOBS="$(sysctl -n hw.ncpu)"
          export CC=/usr/bin/gcc CXX=/usr/bin/g++

          # sjasm (Konamiman) — host C++ build
          git clone https://github.com/Konamiman/Sjasm "$ROOT/Sjasm"
          cd "$ROOT/Sjasm" && git checkout "${SJASM_VERSION}" && cd Sjasm
          make clean || true
          make sjasm -j"$JOBS"
          cp sjasm "$GDK/bin/sjasm"

          # native tools — build each only if its source exists in this SGDK version
          # (convsym was added in v2.10; xgmtool/bintos go further back). Skipping a missing one
          # is correct: that version's makefile doesn't use it.
          # -include stdint.h: some older versions (e.g. v1.80) use uint8_t in headers without it.
          if [ -d "$GDK/tools/xgmtool" ]; then ( cd "$GDK/tools/xgmtool" && gcc -include stdint.h src/*.c -Wall -O2 -lm -o xgmtool && cp xgmtool "$GDK/bin/" ); fi
          if [ -d "$GDK/tools/bintos" ];  then ( cd "$GDK/tools/bintos"  && gcc -include stdint.h src/bintos.c -Wall -O2 -o bintos && cp bintos "$GDK/bin/" ); fi
          if [ -d "$GDK/tools/convsym" ]; then ( cd "$GDK/tools/convsym" && make -j"$JOBS" && cp build/convsym "$GDK/bin/" ); fi

          # mac68k (prebuilt, for .asm projects)
          cp "$ROOT/mac68k-${{ matrix.name }}/mac68k" "$GDK/bin/mac68k"
          chmod +x "$GDK/bin/mac68k"

      # Linux: same native tools, built INSIDE manylinux2014 (glibc 2.17). Output goes into the
      # bind-mounted SGDK/bin; chown back to the runner so the host libmd/package steps can use it.
      - name: Build native SGDK tools (Linux in manylinux2014) + mac68k
        if: ${{ matrix.os == 'linux' }}
        shell: bash
        run: |
          set -ex
          docker run --rm -e SJASM_VERSION -v "$PWD:$PWD" -w "$PWD" \
            "${{ matrix.container }}" bash -euxc '
              ROOT="$PWD"; GDK="$ROOT/SGDK"; JOBS="$(nproc)"
              git config --global --add safe.directory "*"
              git clone https://github.com/Konamiman/Sjasm "$ROOT/Sjasm"
              cd "$ROOT/Sjasm" && git checkout "${SJASM_VERSION}" && cd Sjasm
              make clean || true; make sjasm -j"$JOBS"; cp sjasm "$GDK/bin/sjasm"
              if [ -d "$GDK/tools/xgmtool" ]; then ( cd "$GDK/tools/xgmtool" && gcc -include stdint.h src/*.c -Wall -O2 -lm -o xgmtool && cp xgmtool "$GDK/bin/" ); fi
              if [ -d "$GDK/tools/bintos" ];  then ( cd "$GDK/tools/bintos"  && gcc -include stdint.h src/bintos.c -Wall -O2 -o bintos && cp bintos "$GDK/bin/" ); fi
              if [ -d "$GDK/tools/convsym" ]; then ( cd "$GDK/tools/convsym" && make -j"$JOBS" && cp build/convsym "$GDK/bin/" ); fi
              # hand the WHOLE SGDK tree back to the runner: the container (root) also wrote build
              # artifacts under tools/*/ , and the host libmd step `git clean`s them -> must be runner-owned.
              chown -R "$(stat -c "%u:%g" "$ROOT")" "$GDK"
            '
          # mac68k (prebuilt from maccer) — copied on the host
          cp "$PWD/mac68k-${{ matrix.name }}/mac68k" "$PWD/SGDK/bin/mac68k"
          chmod +x "$PWD/SGDK/bin/mac68k"

      - name: Build libmd.a (release + debug)
        if: ${{ matrix.os != 'windows-cross' }}
        shell: bash
        run: |
          set -ex
          ROOT="$PWD"
          export PATH="$ROOT/SGDK/bin:$ROOT/m68k-elf-toolchain/bin:$PATH"
          cd "$ROOT/SGDK"
          # Version-agnostic: SGDK versions differ in clean target names
          # (clean-release vs cleanrelease) AND object placement (out/<type>/ vs
          # next to sources). So: build release, then wipe build artifacts with git
          # (keeping the built tools in bin/ and the release lib in lib/), then build
          # debug so its objects are recompiled with debug flags.
          make -f makelib.gen release
          git clean -fdx -e /bin -e /lib
          make -f makelib.gen debug
          ls -l lib/

      - name: Package self-contained SGDK
        if: ${{ matrix.os != 'windows-cross' }}
        id: pkg
        shell: bash
        run: |
          set -ex
          GDK="$PWD/SGDK"
          # drop VCS + Windows-only binaries (native unix distro); keep jars + native tools
          rm -rf "$GDK/.git"
          find "$GDK/bin" -type f \( -name '*.exe' -o -name '*.dll' \) -delete || true
          ASSET="sgdk-${{ inputs.release_tag }}-${{ matrix.name }}.tar.gz"
          tar czf "$ASSET" -C "$PWD" SGDK
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          ls -lh "$ASSET"

      # --- Windows self-contained bundle (cross-built on ubuntu via mingw) ---
      # Mirrors what upstream SGDK ships: a $(GDK) tree whose bin/ has the m68k toolchain
      # (bare names), the MSYS shell utils (kept from upstream), the native tools as .exe,
      # mac68k.exe, the jars, + lib/{libgcc,libmd,libmd_debug}.a. We never run gcc.exe here:
      # native tools are mingw-cross-compiled, and libmd.a (target object code) is built with
      # the *Linux* m68k toolchain. KEEP .exe/.dll (unlike the Unix package step).
      - name: Build + package Windows bundle (cross)
        if: ${{ matrix.os == 'windows-cross' }}
        id: pkgwin
        shell: bash
        run: |
          set -ex
          ROOT="$PWD"
          GDK="$ROOT/SGDK"
          JOBS="$(nproc)"
          CCW=x86_64-w64-mingw32-gcc
          CXXW=x86_64-w64-mingw32-g++
          STRIPW=x86_64-w64-mingw32-strip
          STATIC="-static -static-libgcc -static-libstdc++"

          # --- W2: fetch Windows toolchain (for the bundle) + Linux toolchain (to build libmd) + maccer ---
          curl -fSL -o win-tc.tar.gz \
            "https://github.com/${TOOLCHAIN_REPO}/releases/download/${TOOLCHAIN_TAG}/m68k-elf-toolchain-gcc${GCC_VERSION}-windows-x86_64.tar.gz"
          mkdir -p win-tc && tar xf win-tc.tar.gz -C win-tc          # -> win-tc/m68k-elf-toolchain/{bin,lib}
          curl -fSL -o lx-tc.tar.gz \
            "https://github.com/${TOOLCHAIN_REPO}/releases/download/${TOOLCHAIN_TAG}/m68k-elf-toolchain-gcc${GCC_VERSION}-linux-x86_64.tar.gz"
          mkdir -p lx-tc && tar xf lx-tc.tar.gz -C lx-tc            # -> lx-tc/m68k-elf-toolchain/{bin,lib}
          curl -fSL -o maccer.zip \
            "https://github.com/${MACCER_REPO}/releases/download/${MACCER_TAG}/mac68k-windows-x86_64.zip"
          unzip -o maccer.zip                                       # -> mac68k-windows-x86_64/mac68k.exe
          WIN_TC="$ROOT/win-tc/m68k-elf-toolchain"
          LX_TC="$ROOT/lx-tc/m68k-elf-toolchain"

          # --- W4: cross-build native tools to .exe (mingw) ---
          git clone https://github.com/Konamiman/Sjasm "$ROOT/Sjasm"
          ( cd "$ROOT/Sjasm" && git checkout "${SJASM_VERSION}" )
          # sjasm Makefile hard-codes g++/strip in the link recipe + gates .exe on `uname|grep MINGW`,
          # neither of which works cross on Linux -> compile/link explicitly.
          ( cd "$ROOT/Sjasm/Sjasm"
            $CXXW -Wall -O2 -DMINGW -c *.cpp
            $CXXW $STATIC -o sjasm.exe *.o
            $STRIPW sjasm.exe
            cp sjasm.exe "$GDK/bin/sjasm.exe" )
          # native tools — only those present in this SGDK version (convsym arrived in v2.10)
          if [ -d "$GDK/tools/xgmtool" ]; then ( cd "$GDK/tools/xgmtool" && $CCW -include stdint.h src/*.c -Wall -O2 $STATIC -lm -o xgmtool.exe && $STRIPW xgmtool.exe && cp xgmtool.exe "$GDK/bin/" ); fi
          if [ -d "$GDK/tools/bintos" ];  then ( cd "$GDK/tools/bintos"  && $CCW -include stdint.h src/bintos.c -Wall -O2 $STATIC -o bintos.exe && $STRIPW bintos.exe && cp bintos.exe "$GDK/bin/" ); fi
          if [ -d "$GDK/tools/convsym" ]; then
            ( cd "$GDK/tools/convsym"
              make CXX="$CXXW" LDFLAGS="-s $STATIC" -j"$JOBS"
              if [ -f build/convsym.exe ]; then cp build/convsym.exe "$GDK/bin/convsym.exe"; else cp build/convsym "$GDK/bin/convsym.exe"; fi )
          fi
          cp "$ROOT/mac68k-windows-x86_64/mac68k.exe" "$GDK/bin/mac68k.exe"

          # --- W5: replace m68k toolchain in SGDK/bin with ours; KEEP MSYS layer; purge old-gcc cruft ---
          for f in gcc.exe cpp.exe cc1.exe lto1.exe lto-wrapper.exe \
                   as.exe ld.exe ar.exe nm.exe objcopy.exe objdump.exe ranlib.exe strip.exe \
                   liblto_plugin.dll; do
            [ -f "$WIN_TC/bin/$f" ] && cp "$WIN_TC/bin/$f" "$GDK/bin/$f"
          done
          cp "$WIN_TC"/bin/*.dll "$GDK/bin/" 2>/dev/null || true    # our mingw runtime DLLs (match our gcc ABI)
          mkdir -p "$GDK/lib"
          cp "$WIN_TC/lib/libgcc.a" "$GDK/lib/libgcc.a"
          # purge upstream's bundled-gcc remnants (older Windows bundles ship gcc 6.3.0): -B$(BIN)
          # ignores them at runtime but they bloat/confuse the asset.
          rm -rf "$GDK/bin/lib/gcc" "$GDK/bin/libexec" 2>/dev/null || true
          find "$GDK/bin" -maxdepth 1 -name 'm68k-elf-*.exe' -delete 2>/dev/null || true
          # gdb is NOT a build tool (the makefile never invokes it) -> not shipped in the bundle.
          # sgdkx downloads m68k-elf-gdb per platform separately (incl. Windows). Drop upstream's
          # gdb.exe so the bundle doesn't carry a stale, unmanaged duplicate.
          rm -f "$GDK/bin/gdb.exe" 2>/dev/null || true
          # KEPT verbatim from upstream: sh.exe/rm.exe/cp.exe/mkdir.exe/make.exe + msys-*.dll + *.jar

          # --- bundle any mingw runtime DLL the .exe files actually import (transitive closure) ---
          locate_dll() {
            local p; p="$($CCW -print-file-name="$1" 2>/dev/null)"
            if [ -f "$p" ]; then echo "$p"; return 0; fi
            find /usr/lib/gcc/x86_64-w64-mingw32 /usr/x86_64-w64-mingw32 2>/dev/null -name "$1" | head -1
          }
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for f in "$GDK/bin/"*.exe "$GDK/bin/"*.dll; do
              [ -f "$f" ] || continue
              for d in $(x86_64-w64-mingw32-objdump -p "$f" 2>/dev/null | awk '/DLL Name:/{print $3}'); do
                case "$d" in
                  libgcc_s_*.dll|libstdc++-*.dll|libwinpthread-*.dll|libssp-*.dll|libgomp-*.dll|libquadmath-*.dll)
                    if [ ! -f "$GDK/bin/$d" ]; then
                      src="$(locate_dll "$d")"
                      if [ -n "$src" ] && [ -f "$src" ]; then cp "$src" "$GDK/bin/$d"; changed=1; fi
                    fi ;;
                esac
              done
            done
          done

          # --- W6: build libmd.a + libmd_debug.a with the LINUX m68k toolchain (target object code) ---
          # Build in a scratch copy populated with LINUX native tools; common.mk on this ubuntu
          # runner takes the Unix branch (PREFIX=m68k-elf-, bare convsym/sjasm/bintos from PATH).
          cp -a "$GDK" "$ROOT/SGDK-lib"
          GDKL="$ROOT/SGDK-lib"
          # rebuild sjasm natively (force-drop the mingw .o objects from the cross build first)
          ( cd "$ROOT/Sjasm/Sjasm" && rm -f *.o sjasm sjasm.exe; make sjasm -j"$JOBS"; cp sjasm "$GDKL/bin/sjasm" )
          if [ -d "$GDKL/tools/xgmtool" ]; then ( cd "$GDKL/tools/xgmtool" && gcc -include stdint.h src/*.c -O2 -lm -o xgmtool && cp xgmtool "$GDKL/bin/xgmtool" ); fi
          if [ -d "$GDKL/tools/bintos" ];  then ( cd "$GDKL/tools/bintos"  && gcc -include stdint.h src/bintos.c -O2 -o bintos && cp bintos "$GDKL/bin/bintos" ); fi
          if [ -d "$GDKL/tools/convsym" ]; then ( cd "$GDKL/tools/convsym" && rm -rf build; make -j"$JOBS"; cp build/convsym "$GDKL/bin/convsym" ); fi
          export PATH="$GDKL/bin:$LX_TC/bin:$PATH"
          ( cd "$GDKL"
            make -f makelib.gen release
            # wipe build artifacts between release and debug (keep bin/ tools + lib/ release lib).
            # NOT `|| true`: a clean failure here would silently let `debug` reuse release objects,
            # shipping a libmd_debug.a without debug flags.
            git clean -fdx -e /bin -e /lib
            make -f makelib.gen debug
            ls -l lib/ )
          cp "$GDKL/lib/libmd.a"       "$GDK/lib/libmd.a"
          cp "$GDKL/lib/libmd_debug.a" "$GDK/lib/libmd_debug.a"

          # --- W7: verify the bundle is complete, then package (KEEP .exe/.dll — they ARE the distro) ---
          rm -rf "$GDK/.git"
          # assert the critical pieces landed (the `[ -f ] && cp` guards above skip silently on a
          # layout mismatch; catch a gcc-less / lib-less bundle here instead of on the user's box).
          # Always-required (every SGDK >= v1.70):
          for need in bin/gcc.exe bin/cc1.exe bin/as.exe bin/ld.exe bin/ar.exe bin/nm.exe \
                      bin/objcopy.exe bin/liblto_plugin.dll bin/sh.exe bin/make.exe bin/rm.exe \
                      bin/sjasm.exe bin/mac68k.exe \
                      lib/libgcc.a lib/libmd.a lib/libmd_debug.a; do
            [ -e "$GDK/$need" ] || { echo "ERROR: bundle missing $need" >&2; exit 1; }
          done
          # version-variable native tools: assert only when this SGDK version ships the source
          # (convsym arrived in v2.10; xgmtool/bintos go back further).
          for t in xgmtool bintos convsym; do
            if [ -d "$GDK/tools/$t" ]; then
              [ -e "$GDK/bin/$t.exe" ] || { echo "ERROR: bundle missing bin/$t.exe (tools/$t present)" >&2; exit 1; }
            fi
          done
          # audit AND assert imported mingw runtime DLLs are bundled
          echo "=== SGDK/bin DLL import audit ==="
          missing=0
          for f in "$GDK/bin/"*.exe; do
            [ -f "$f" ] || continue
            echo "-- $(basename "$f") --"
            for d in $(x86_64-w64-mingw32-objdump -p "$f" 2>/dev/null | awk '/DLL Name:/{print $3}'); do
              echo "   $d"
              case "$d" in
                libgcc_s_*.dll|libstdc++-*.dll|libwinpthread-*.dll|libssp-*.dll|libgomp-*.dll|libquadmath-*.dll)
                  [ -f "$GDK/bin/$d" ] || { echo "   ERROR: $d imported by $(basename "$f") but not bundled" >&2; missing=1; } ;;
              esac
            done
          done
          [ "$missing" = 0 ] || { echo "ERROR: required mingw runtime DLL(s) missing from bundle" >&2; exit 1; }
          ASSET="sgdk-${{ inputs.release_tag }}-windows-x86_64.tar.gz"
          tar czf "$ASSET" -C "$ROOT" SGDK
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          ls -lh "$ASSET"

      # No upload-artifact here: the release upload below ships the exact same
      # tarball, and release assets are free storage while Actions artifacts are
      # billed per GB-day. Nothing downloads these artifacts.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          ASSET: ${{ steps.pkg.outputs.asset || steps.pkgwin.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          # Addressed by release id, never by tag: the release is a draft until finalize
          # publishes it, and GET /releases/tags/<tag> does not return drafts. `gh release
          # upload <tag>` has a GraphQL fallback for that, but it is reported to fail with the
          # Actions token, so the id avoids the question. This replaces --clobber: drop a
          # same-named asset left by an earlier run, then POST the tarball.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.name)\t\(.id)"' \
          | awk -F'\t' -v n="$ASSET" '$1 == n { print $2 }' \
          | while read -r aid; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid"
            done
          curl -fsSL --retry 3 -X POST -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/gzip" \
            --data-binary @"$ASSET" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET"

  # Docs are platform-independent: generate ONCE and ship as a separate asset
  # (sgdkx downloads it instead of running doxygen locally). Recipe mirrors sgdkx's
  # generate_sgdk_doc (src/commands/setup.rs): rewrite OUTPUT_DIRECTORY to ./SGDK/doc
  # and run doxygen from the PARENT of SGDK so the config's INPUT = ./SGDK/... resolves.
  docs:
    name: docs
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Checkout SGDK at ref (must be a dir named 'SGDK')
        shell: bash
        run: |
          set -ex
          git clone "https://github.com/${SGDK_REPO}.git" SGDK
          ( cd SGDK && git checkout "${{ inputs.sgdk_ref }}" )

      - name: Generate docs (sgdkx recipe)
        shell: bash
        run: |
          set -ex
          CFG="SGDK/doc/doxyconfig"
          if [ ! -f "$CFG" ]; then echo "no $CFG — skipping docs"; exit 0; fi
          TMP="SGDK/doc/temp_doxyconfig"
          cp "$CFG" "$TMP"
          # original OUTPUT_DIRECTORY is absolute (/tmp/doxygen); rewrite to ./SGDK/doc
          sed -i -E 's|^OUTPUT_DIRECTORY[[:space:]]*=.*$|OUTPUT_DIRECTORY = ./SGDK/doc|' "$TMP"
          # run from the parent of SGDK so INPUT = ./SGDK/... resolves (CWD = workspace root)
          doxygen "$TMP"
          rm -f "$TMP"
          test -f SGDK/doc/html/index.html

      - name: Package docs
        id: pkg
        shell: bash
        run: |
          set -ex
          if [ ! -d SGDK/doc/html ]; then echo "no docs generated — nothing to publish"; exit 0; fi
          ASSET="sgdk-docs-${{ inputs.release_tag }}.tar.gz"
          tar czf "$ASSET" -C SGDK/doc html
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          ls -lh "$ASSET"

      # No upload-artifact here either — same reasoning as the build job above.
      - name: Upload to release
        if: steps.pkg.outputs.asset != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          # Addressed by release id, never by tag: the release is a draft until finalize
          # publishes it, and GET /releases/tags/<tag> does not return drafts. `gh release
          # upload <tag>` has a GraphQL fallback for that, but it is reported to fail with the
          # Actions token, so the id avoids the question. This replaces --clobber: drop a
          # same-named asset left by an earlier run, then POST the tarball.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.name)\t\(.id)"' \
          | awk -F'\t' -v n="$ASSET" '$1 == n { print $2 }' \
          | while read -r aid; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid"
            done
          curl -fsSL --retry 3 -X POST -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/gzip" \
            --data-binary @"$ASSET" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET"

  # Publish gate. The release stays a DRAFT until every platform bundle is attached: drafts are
  # absent from the unauthenticated /releases listing, so a run that loses one platform -- e.g. a
  # macOS job that never gets a hosted runner -- cannot expose a release that 404s for it.
  # sgdkx resolves `--version master` by walking that listing and taking the first master-* tag
  # (release.rs latest_master_tag), then downloading sgdk-<tag>-<platform>.tar.gz directly, so a
  # published-but-incomplete release breaks exactly the platform whose build failed. sync.yml's
  # discover re-plans any release that is draft or missing an asset, and this job publishes it.
  finalize:
    name: publish when complete
    needs: [release, build, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release once every platform asset is present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REF="${{ inputs.sgdk_ref }}"
          RID="${{ needs.release.outputs.release_id }}"
          if [ -z "$RID" ]; then
            echo "::error::the release job produced no release id -- nothing to publish"
            exit 1
          fi

          # Keep this platform list in step with the one sync.yml's discover uses to decide which
          # existing releases are incomplete and need a backfill build. Docs are NOT required:
          # old SGDK versions ship no doxyconfig, so that asset is legitimately absent.
          have="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].name')"
          missing=""
          for p in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64 windows-x86_64; do
            grep -qxF "sgdk-$TAG-$p.tar.gz" <<<"$have" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::$TAG stays a draft -- missing platform bundle(s):$missing"
            exit 1
          fi

          # Complete: publish AND decide the "Latest" badge in one request, so the release is never
          # briefly Latest with the wrong value. Only the master build whose commit IS the current
          # SGDK master HEAD may take it; version tags and OLD-master backfills (built later by
          # wall-clock) must never grab it.
          SGDK_SHA="$(gh api "repos/${SGDK_REPO}/commits/${REF}" --jq '.sha')"
          master_head="$(gh api "repos/${SGDK_REPO}/commits/master" --jq '.sha')"
          if [ "${TAG#master-}" != "$TAG" ] && [ "$SGDK_SHA" = "$master_head" ]; then
            latest=true
          else
            latest=false
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
            -F draft=false -f make_latest="$latest" >/dev/null
          echo "published $TAG (make_latest=$latest)"
